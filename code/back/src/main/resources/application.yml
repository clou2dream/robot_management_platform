server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:./config/application-middleware.yml
  application:
    name: robot-management-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: robot-management
    secret: ${JWT_SECRET:please-change-this-development-secret-with-at-least-32-bytes}
    access-token-ttl: PT8H
    refresh-token-ttl: P7D
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookie-secure: ${COOKIE_SECURE:false}
